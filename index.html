<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07131d">
  <meta name="description" content="Escape-Archiv mit den Spielen Akte Nachtlicht und Der verschwundene Drache">
  <title>Escape-Archiv · Nachtlicht &amp; Drache</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <main class="shell">
    <section class="case-file" aria-labelledby="title">
      <header class="case-header">
        <div id="classification" class="classification">SPIELARCHIV</div>
        <div id="caseNumber" class="case-number">ZWEI FÄLLE</div>
      </header>

      <div class="brand-row">
        <div id="themeEmblem" class="theme-emblem" aria-hidden="true"></div>
        <div>
          <div class="eyebrow">ESCAPE DECODER</div>
          <h1 id="title">Escape-Archiv</h1>
        </div>
      </div>

      <p id="story" class="story"></p>

      <div id="selectWrap" class="selection-panel">
        <div class="menu-heading">
          <span class="menu-ornament" aria-hidden="true"></span>
          <h2>Einsatzakte wählen</h2>
          <p>Jede Akte besitzt ihre eigene Welt, Rätselroute und Abschlussüberraschung.</p>
        </div>
        <div id="gameGrid" class="game-grid" aria-label="Verfügbare Spiele"></div>
      </div>

      <div id="decoder" hidden>
        <div class="status" aria-label="Rätselstatus">
          <span id="stepLabel"></span><span id="typeLabel"></span>
        </div>
        <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
        <button id="backMenu" class="back-menu" type="button">← Spiel wechseln</button>

        <div class="puzzle-sheet">
          <div class="paper-clip" aria-hidden="true"></div>
          <h2 id="puzzleTitle"></h2>
          <p id="prompt"></p>
          <label for="answer">Eure Lösung</label>
          <input id="answer" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="Code oder Lösungswort">
          <button id="check" type="button"><span>Prüfen</span></button>
          <p id="message" aria-live="polite"></p>
        </div>
      </div>

      <footer><span id="footerBrand">ESCAPE-ARCHIV</span><span id="footerStatus">BEREIT</span></footer>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
